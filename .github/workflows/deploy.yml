name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_K0ZUeubb2hzQm4o5dxbpfzCx
      VERCEL_PROJECT_ID: prj_Kxm4SiwBFGHm2uNLJ0DiBqbXq8IV
    steps:
      - uses: actions/checkout@v4
        with:
          # model.ubj files are Git-LFS pointers without this — the ML
          # inference functions would fail their checksum verification at
          # runtime otherwise.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Install uv
        # vercel build shells out to uv to resolve/install the /api Python
        # function's requirements.txt. Vercel's own infrastructure has it
        # preinstalled; a GitHub Actions runner does not.
        uses: astral-sh/setup-uv@v3

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
